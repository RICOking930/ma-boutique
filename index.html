<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegance Boutique By CINDY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>💕 ELEGANCE BOUTIQUE BY CINDY</h1>
        <div class="nav-buttons">
            <button id="btn-cart" class="btn-nav btn-cart" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping"></i> Panier (<span id="cart-count">0</span>)
            </button>
        </div>
    </header>

    <main class="main-container">
        <div class="search-filter-section">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="Rechercher un vêtement..." onkeyup="filterProducts()">
            </div>
            <div class="categories">
                <button class="cat-btn active" onclick="filterCategory('all', this)">Tous</button>
                <button class="cat-btn" onclick="filterCategory('Robes', this)">Robes</button>
                <button class="cat-btn" onclick="filterCategory('Ensembles', this)">Ensembles</button>
                <button class="cat-btn" onclick="filterCategory('Hauts', this)">Hauts</button>
                <button class="cat-btn" onclick="filterCategory('Pantalons', this)">Pantalons</button>
                <button class="cat-btn" onclick="filterCategory('Chaussures', this)">Chaussures</button>
                <button class="cat-btn" onclick="filterCategory('Accessoires', this)">Accessoires</button>
            </div>
        </div>

        <div id="articles-container" class="products-grid">
            <!-- Les articles de Firebase s'affichent ici -->
        </div>
    </main>

    <!-- PANIER SLIDE-OVER -->
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3><i class="fa-solid fa-bag-shopping"></i> Votre Panier</h3>
            <button class="close-btn" onclick="toggleCart()">&times;</button>
        </div>
        <div id="cart-items" class="cart-items-container"></div>
        <div class="cart-footer">
            <div class="cart-total-text">Total : <span id="cart-total-price">0 FCFA</span></div>
            <div class="checkout-fields">
                <input type="text" id="client-name" placeholder="Votre nom complet" required>
                <input type="tel" id="client-phone" placeholder="Votre numéro WhatsApp" required>
                <select id="client-zone">
                    <option value="Cocody">Abidjan - Cocody</option>
                    <option value="Yopougon">Abidjan - Yopougon</option>
                    <option value="Marcory">Abidjan - Marcory</option>
                    <option value="Koumassi">Abidjan - Koumassi</option>
                    <option value="Autre commune">Autre commune</option>
                    <option value="Intérieur du pays">Intérieur du pays</option>
                </select>
                <select id="payment-method">
                    <option value="Wave">Wave</option>
                    <option value="Orange Money">Orange Money</option>
                    <option value="MTN MoMo">MTN MoMo</option>
                    <option value="Espèces">Espèces à la livraison</option>
                </select>
                <button class="btn-submit-wa" onclick="sendOrderToWhatsApp()">
                    <i class="fa-brands fa-whatsapp"></i> Valider sur WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
